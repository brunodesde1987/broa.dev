name: WhatsApp Group Sync

on:
  push:
    paths:
      - 'chats/**/*.zip'
    workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo
  GROUP_SLUG: tech-debt
  BASE_PATH: /tech-debt

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p ".tmp" "${GROUP_SLUG}/raw" "${GROUP_SLUG}/daily"

      - name: Unzip chats and normalize today's messages
        run: |
          set -euo pipefail

          TODAY=$(date +%F)          # YYYY-MM-DD
          HOUR=$(date +%H)           # 00..23
          TDATE=$(date +%d/%m/%Y)    # DD/MM/YYYY for WhatsApp iOS headers

          echo "Today (local): $TODAY ; Hour: $HOUR ; TDATE: $TDATE"

          shopt -s nullglob
          for ZIP in chats/**/*.zip; do
            echo "Processing: $ZIP"
            DEST=".tmp/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"
            unzip -o "$ZIP" -d "$DEST" >/dev/null

            # _chat.txt, _chat 2.txt, _chat 3.txt, ...
            while IFS= read -r -d '' TXT; do
              echo "Found chat txt: $TXT"
              awk -v TDATE="$TDATE" '
                BEGIN { in_today = 0 }
                /^[0-9]{1,2}\/[0-9]{1,2}\/[0-9]{2,4},?[[:space:]][0-9]{1,2}:[0-9]{2}[[:space:]]-[[:space:]]/ {
                  match($0, /^([0-9]{1,2}\/[0-9]{1,2}\/[0-9]{2,4})/, m)
                  if (m[1] == TDATE) { in_today = 1 } else { in_today = 0 }
                  if (in_today) print $0
                  next
                }
                { if (in_today) print $0 }
              ' "$TXT" >> "${GROUP_SLUG}/raw/${TODAY}.txt"
            done < <(find "$DEST" -type f -iname '_chat*.txt' -print0)

            rm -rf "$DEST"
            git rm -f "$ZIP" || true
          done

          if [ -f "${GROUP_SLUG}/raw/${TODAY}.txt" ]; then
            awk '!seen[$0]++' "${GROUP_SLUG}/raw/${TODAY}.txt" > "${GROUP_SLUG}/raw/${TODAY}.txt.tmp" && mv "${GROUP_SLUG}/raw/${TODAY}.txt.tmp" "${GROUP_SLUG}/raw/${TODAY}.txt"
          fi

          echo "Done collecting today's messages."
          echo "HOUR=$HOUR" >> $GITHUB_ENV
          echo "TODAY=$TODAY" >> $GITHUB_ENV

      - name: Create/update stub daily summary after 18:00
        if: ${{ env.HOUR >= '10' }}
        run: |
          set -euo pipefail
          TODAY="${{ env.TODAY }}"
          RAW="${GROUP_SLUG}/raw/${TODAY}.txt"
          OUT="${GROUP_SLUG}/daily/${TODAY}.md"

          if [ -f "$RAW" ]; then
            COUNT=$(wc -l < "$RAW" | tr -d ' ')
          else
            COUNT=0
          fi

          {
            echo "# Daily Notes — ${TODAY}"
            echo
            echo "_Stub summary generated by CI (messages today: ${COUNT})._"
            echo
            echo "- This is a placeholder generated after 18:00 (America/Sao_Paulo)."
            echo "- Replace with AI-generated summary when the processing script is added."
            echo
          } > "$OUT"

      - name: Update index with /tech-debt base path
        run: |
          set -euo pipefail
          TODAY="${{ env.TODAY }}"
          INDEX="${GROUP_SLUG}/index.md"
          {
            echo "# Tech Debt Group — Daily Notes"
            echo
            if [ -f "${GROUP_SLUG}/daily/${TODAY}.md" ]; then
              echo "- **Latest daily note:** [${TODAY}](${BASE_PATH}/daily/${TODAY}.md)"
            else
              echo "- **Latest daily note:** (none today yet)"
            fi
            echo "- **Members Directory:** [${BASE_PATH}/members.md](${BASE_PATH}/members.md)"
            echo
          } > "$INDEX"

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): normalize WhatsApp export (simple flow), update index (/tech-debt) and stub daily note"
            git push
          else
            echo "No changes to commit."
          fi
