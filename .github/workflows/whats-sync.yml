name: WhatsApp Group Sync (Simple, /tech-debt, fast-forward safe)

on:
  push:
    paths:
      - 'chats/**/*.zip'
      - 'tech-debt/chats/**/*.zip'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: whats-sync
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  GROUP_SLUG: tech-debt
  BASE_PATH: /tech-debt
  ZIP_ROOTS: "chats tech-debt/chats"   # process zips from both locations

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ensure our local branch exactly matches remote before we modify files
      - name: Sync to latest remote (avoid non-fast-forward)
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p ".tmp" "${GROUP_SLUG}/raw" "${GROUP_SLUG}/daily"

      - name: Unzip chats and normalize today's messages
        run: |
          set -euo pipefail

          TODAY=$(date +%F)          # YYYY-MM-DD
          HOUR=$(date +%H)           # 00..23
          TDATE=$(date +%d/%m/%Y)    # DD/MM/YYYY for WhatsApp iOS headers

          echo "Today (local): $TODAY ; Hour: $HOUR ; TDATE: $TDATE"

          shopt -s nullglob
          handled_any=0

          for ROOT in ${ZIP_ROOTS}; do
            if [ ! -d "$ROOT" ]; then
              echo "Skip: $ROOT (not a directory)"
              continue
            fi

            # find zips under this root (space-safe)
            while IFS= read -r -d '' ZIP; do
              echo "Processing ZIP: $ZIP"
              handled_any=1
              DEST=".tmp/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -o "$ZIP" -d "$DEST" >/dev/null

              # iOS exports: _chat.txt, _chat 2.txt, _chat 3.txt, ...
              while IFS= read -r -d '' TXT; do
                echo "Found chat txt: $TXT"

                # ---- Portable awk: use a regex variable, no / escaping, no [:space:] ----
                # Header examples:
                #   "03/10/2025, 09:12 - Bruno: Hello"
                #   "03/10/2025 09:12 - Bruno: Hello"  (no comma)
                # Regex: ^DD/MM/YYYY[ ,]HH:MM -  (we only need to detect "new message" lines)
                awk -v TDATE="$TDATE" '
                  BEGIN {
                    re_new = "^[0-9]{1,2}/[0-9]{1,2}/[0-9]{2,4}[ ,][0-9]{1,2}:[0-9]{2} - ";
                    in_today = 0;
                  }
                  $0 ~ re_new {
                    # Extract the date part at the beginning (DD/MM/YYYY)
                    # Using split on space or comma to grab the first token
                    n = split($0, a, /[ ,]/);
                    datepart = a[1];
                    in_today = (datepart == TDATE) ? 1 : 0;
                    if (in_today) print $0;
                    next;
                  }
                  { if (in_today) print $0 }
                ' "$TXT" >> "${GROUP_SLUG}/raw/${TODAY}.txt"

              done < <(find "$DEST" -type f -iname '_chat*.txt' -print0)

              # Clean temp and stage ZIP deletion so it appears in the commit
              rm -rf "$DEST"
              git rm -f "$ZIP" || true
            done < <(find "$ROOT" -type f -name '*.zip' -print0)
          done

          if [ "$handled_any" = 0 ]; then
            echo "No zip files found under: ${ZIP_ROOTS}"
          fi

          # De-duplicate lines in today's raw file (multiple zips same day)
          if [ -f "${GROUP_SLUG}/raw/${TODAY}.txt" ]; then
            awk '!seen[$0]++' "${GROUP_SLUG}/raw/${TODAY}.txt" > "${GROUP_SLUG}/raw/${TODAY}.txt.tmp" && mv "${GROUP_SLUG}/raw/${TODAY}.txt.tmp" "${GROUP_SLUG}/raw/${TODAY}.txt"
          fi

          echo "HOUR=$HOUR" >> $GITHUB_ENV
          echo "TODAY=$TODAY" >> $GITHUB_ENV

      - name: Create/update stub daily summary (only after 18:00)
        run: |
          set -euo pipefail
          TODAY="${TODAY:-$(date +%F)}"
          HOUR="${HOUR:-$(date +%H)}"
          RAW="${GROUP_SLUG}/raw/${TODAY}.txt}"
          OUT="${GROUP_SLUG}/daily/${TODAY}.md"

          if [ "$HOUR" -ge 18 ]; then
            if [ -f "$RAW" ]; then
              COUNT=$(wc -l < "$RAW" | tr -d ' ')
            else
              COUNT=0
            fi

            {
              echo "# Daily Notes — ${TODAY}"
              echo
              echo "_Stub summary generated by CI (messages today: ${COUNT})._"
              echo
              echo "- This is a placeholder generated after 18:00 (America/Sao_Paulo)."
              echo "- Replace with AI-generated summary when the processing script is added."
              echo
            } > "$OUT"
          else
            echo "Before 18:00 local time; skipping stub daily summary."
          fi

      - name: Ensure members.md exists
        run: |
          set -euo pipefail
          if [ ! -f "${GROUP_SLUG}/members.md" ]; then
            {
              echo "# Members Directory"
              echo
              echo "_No entries yet. This file will be filled once the AI processing is added._"
              echo
              echo "| Name | Company | Role/Stack | Tools | Location | LinkedIn |"
              echo "|------|---------|-----------|-------|----------|----------|"
            } > "${GROUP_SLUG}/members.md"
          fi

      - name: Update index (base path /tech-debt)
        run: |
          set -euo pipefail
          TODAY="${TODAY:-$(date +%F)}"
          INDEX="${GROUP_SLUG}/index.md"
          {
            echo "# Tech Debt Group — Daily Notes"
