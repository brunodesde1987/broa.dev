name: WhatsApp Group Sync (/tech-debt, simple)

on:
  push:
    paths:
      - 'chats/**/*.zip'
      - 'tech-debt/chats/**/*.zip'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: whats-sync
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: America/Sao_Paulo
  GROUP_SLUG: tech-debt
  BASE_PATH: /tech-debt
  ZIP_ROOTS: "chats tech-debt/chats"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest remote (avoid non-fast-forward)
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Process zips, update files, commit
        run: |
          set -euo pipefail

          mkdir -p ".tmp" "${GROUP_SLUG}/raw" "${GROUP_SLUG}/daily"

          TODAY=$(date +%F)          # YYYY-MM-DD
          HOUR=$(date +%H)           # 00..23
          TDATE=$(date +%d/%m/%Y)    # DD/MM/YYYY for WhatsApp iOS headers
          echo "Today (local): $TODAY ; Hour: $HOUR ; TDATE: $TDATE"

          handled_any=0

          # Process zips from both roots
          for ROOT in ${ZIP_ROOTS}; do
            if [ ! -d "$ROOT" ]; then
              echo "Skip: $ROOT (not a directory)"
              continue
            fi

            # Space-safe scan for zips
            while IFS= read -r -d '' ZIP; do
              echo "Processing ZIP: $ZIP"
              handled_any=1
              DEST=".tmp/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -o "$ZIP" -d "$DEST" >/dev/null

              # Find _chat*.txt inside the extracted folder
              while IFS= read -r -d '' TXT; do
                echo "Found chat txt: $TXT"

                # Portable awk: regex in a variable; detect lines like "DD/MM/YYYY[ ,]HH:MM - "
                awk -v TDATE="$TDATE" '
                  BEGIN {
                    re_new = "^[0-9]{1,2}/[0-9]{1,2}/[0-9]{2,4}[ ,][0-9]{1,2}:[0-9]{2} - ";
                    in_today = 0;
                  }
                  $0 ~ re_new {
                    n = split($0, a, /[ ,]/);
                    datepart = a[1];
                    in_today = (datepart == TDATE) ? 1 : 0;
                    if (in_today) print $0;
                    next;
                  }
                  { if (in_today) print $0 }
                ' "$TXT" >> "${GROUP_SLUG}/raw/${TODAY}.txt"

              done < <(find "$DEST" -type f -iname '_chat*.txt' -print0)

              # Clean temp and stage ZIP deletion for commit
              rm -rf "$DEST"
              git rm -f "$ZIP" || true
            done < <(find "$ROOT" -type f -name '*.zip' -print0)
          done

          if [ "$handled_any" = 0 ]; then
            echo "No zip files found under: ${ZIP_ROOTS}"
          fi

          # De-duplicate the raw/today file (if multiple zips)
          if [ -f "${GROUP_SLUG}/raw/${TODAY}.txt" ]; then
            awk '!seen[$0]++' "${GROUP_SLUG}/raw/${TODAY}.txt" > "${GROUP_SLUG}/raw/${TODAY}.txt.tmp" && mv "${GROUP_SLUG}/raw/${TODAY}.txt.tmp" "${GROUP_SLUG}/raw/${TODAY}.txt"
          fi

          # Create/refresh stub daily summary after 18:00 local time
          if [ "$HOUR" -ge 18 ]; then
            RAW="${GROUP_SLUG}/raw/${TODAY}.txt"
            OUT="${GROUP_SLUG}/daily/${TODAY}.md"
            if [ -f "$RAW" ]; then COUNT=$(wc -l < "$RAW" | tr -d ' '); else COUNT=0; fi
            cat > "$OUT" <<EOF
# Daily Notes — ${TODAY}

_Stub summary generated by CI (messages today: ${COUNT})._

- This is a placeholder generated after 18:00 (America/Sao_Paulo).
- Replace with AI-generated summary when the processing script is added.

EOF
          else
            echo "Before 18:00 local time; skipping stub daily summary."
          fi

          # Ensure members.md exists (placeholder until AI step lands)
          if [ ! -f "${GROUP_SLUG}/members.md" ]; then
            cat > "${GROUP_SLUG}/members.md" <<'EOF'
# Members Directory

_No entries yet. This file will be filled once the AI processing is added._

| Name | Company | Role/Stack | Tools | Location | LinkedIn |
|------|---------|-----------|-------|----------|----------|
EOF
          fi

          # Update index.md with /tech-debt base path
          INDEX="${GROUP_SLUG}/index.md"
          if [ -f "${GROUP_SLUG}/daily/${TODAY}.md" ]; then
            LATEST="- **Latest daily note:** [${TODAY}](${BASE_PATH}/daily/${TODAY}.md)"
          else
            LATEST="- **Latest daily note:** (none today yet)"
          fi
          cat > "$INDEX" <<EOF
# Tech Debt Group — Daily Notes

${LATEST}
- **Members Directory:** [${BASE_PATH}/members.md](${BASE_PATH}/members.md)

EOF

          echo "=== git status (before commit) ==="
          git status --porcelain

          # Commit & push
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(ci): process WhatsApp export(s), update /tech-debt"
          BRANCH="${GITHUB_REF_NAME}"

          # Push; if remote advanced, rebase & retry
          for attempt in 1 2 3; do
            if git push origin "$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push failed (attempt $attempt). Rebasing..."
            git fetch origin "$BRANCH"
            git pull --rebase --autostash origin "$BRANCH"
          done
